<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WeChat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#202c33;
}

#login{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px;
  color:white;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  border-radius:25px;
  background:#00a884;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  margin-bottom:20px;
}

h1{
  margin:0 0 8px;
}

p{
  color:#b8c7cc;
}

button{
  width:100%;
  max-width:350px;
  border:0;
  border-radius:30px;
  padding:16px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.google{
  background:white;
  color:#222;
}

.phone{
  background:#00a884;
  color:white;
}

#app{
  display:none;
  height:100vh;
  background:#f5f7f8;
  color:#111;
  flex-direction:column;
}

.header{
  height:65px;
  background:#202c33;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.header h2{
  flex:1;
}

.content{
  flex:1;
  padding:20px;
  overflow:auto;
}

.card{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:12px;
}

.nav{
  height:65px;
  background:#202c33;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav button{
  background:none;
  color:white;
  width:auto;
  margin:0;
  padding:8px;
  font-size:12px;
}

.nav span{
  display:block;
  font-size:22px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">

  <div class="logo">💬</div>

  <h1>WeChat</h1>

  <p>Chat, connect, share and call.</p>

  <button class="google" id="googleBtn">
    🔵 Continue with Google
  </button>

  <button class="phone" id="phoneBtn">
    📱 Continue with Phone
  </button>

</div>


<!-- APP -->
<div id="app">

  <div class="header">
    <h2 id="title">Chats</h2>
    <b>＋</b>
  </div>

  <div class="content">

    <div class="card">
      💬 <b>Chats</b>
      <p>Real-time chat will be connected next.</p>
    </div>

    <div class="card">
      🟢 <b>Stories</b>
      <p>Post and view stories.</p>
    </div>

    <div class="card">
      📝 <b>Posts</b>
      <p>Share photos, videos and text.</p>
    </div>

    <div class="card">
      📢 <b>Channels</b>
      <p>Create and follow channels.</p>
    </div>

    <div class="card">
      📞 <b>Calls</b>
      <p>Voice and video calling will be connected next.</p>
    </div>

  </div>

  <div class="nav">

    <button onclick="show('Chats')">
      <span>💬</span>Chats
    </button>

    <button onclick="show('Stories')">
      <span>🟢</span>Stories
    </button>

    <button onclick="show('Posts')">
      <span>📝</span>Posts
    </button>

    <button onclick="show('Channels')">
      <span>📢</span>Channels
    </button>

    <button onclick="show('Profile')">
      <span>👤</span>Profile
    </button>

  </div>

</div>


<script>

function enterApp(){

  document.getElementById("login").style.display = "none";

  document.getElementById("app").style.display = "flex";

}

document.getElementById("googleBtn").onclick = function(){

  enterApp();

};

document.getElementById("phoneBtn").onclick = function(){

  enterApp();

};

function show(name){

  document.getElementById("title").innerText = name;

}

</script>

</body>
</html>
