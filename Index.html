<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aanya ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  font-family:Arial,sans-serif;
  background:#0b141a;
  overflow:hidden;
}

.app{
  max-width:600px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#efe7dd;
}

/* HEADER */
.header{
  height:70px;
  background:#202c33;
  color:white;
  display:flex;
  align-items:center;
  padding:8px 12px;
  gap:12px;
}

.back{
  font-size:30px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff7eb3,#ff758c);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.info{
  flex:1;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.status{
  font-size:12px;
  color:#b8c7cc;
  margin-top:3px;
}

.head-icons{
  font-size:20px;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:15px 10px;
  background-color:#efe7dd;
  background-image:
    radial-gradient(#d6ccc1 1px,transparent 1px);
  background-size:18px 18px;
}

.message{
  max-width:78%;
  padding:8px 9px;
  margin:6px 0;
  border-radius:8px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
}

.received{
  background:#fff;
  margin-right:auto;
  border-top-left-radius:2px;
}

.sent{
  background:#d9fdd3;
  margin-left:auto;
  border-top-right-radius:2px;
}

.time{
  float:right;
  font-size:10px;
  color:#667781;
  margin-left:8px;
  margin-top:6px;
}

.tick{
  color:#2196d2;
}

/* TYPING */
.typing{
  display:none;
  width:65px;
  padding:9px;
  background:white;
  border-radius:8px;
}

.dot{
  display:inline-block;
  width:6px;
  height:6px;
  margin:0 2px;
  background:#777;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

/* INPUT */
.input-area{
  min-height:62px;
  background:#202c33;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px;
}

.input-box{
  flex:1;
  background:white;
  border-radius:25px;
  display:flex;
  align-items:center;
  padding:0 14px;
}

.emoji{
  font-size:21px;
  margin-right:7px;
}

input{
  width:100%;
  border:0;
  outline:0;
  font-size:15px;
  padding:12px 0;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#00a884;
  color:white;
  font-size:21px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="back">‹</div>

    <div class="avatar">❤️</div>

    <div class="info">
      <div class="name">Aanya ❤️</div>
      <div class="status" id="status">online</div>
    </div>

    <div class="head-icons">📹 &nbsp;☎️</div>
  </div>


  <div class="chat" id="chat">

    <div class="message received">
      Heyy 😊❤️
      <span class="time">9:30 PM</span>
    </div>

    <div class="message received">
      Toh bhai... ab hum officially dating kar rahe hain? 😳🙈
      <span class="time">9:30 PM</span>
    </div>

    <div class="typing" id="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>


  <div class="input-area">

    <div class="input-box">
      <span class="emoji">😊</span>

      <input
        id="input"
        type="text"
        placeholder="Type a message"
        autocomplete="off"
      >
    </div>

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

</div>
